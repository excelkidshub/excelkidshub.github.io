<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admission Form | ExcelKidsHub Phonics Academy Dhanori Pune</title>

<meta name="description" content="Enroll your child at ExcelKidsHub Phonics Academy in Dhanori Pune. Fill the parent enquiry and admission form to secure your seat in upcoming phonics batches.">

<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<script type="application/ld+json">
{
"@context": "https://schema.org",
"@type": "LocalBusiness",
"name": "ExcelKidsHub Phonics Academy",
"url": "https://excelkidshub.in",
"telephone": "+918793135679",
"address": {
  "@type": "PostalAddress",
  "streetAddress": "Inside Lakewood Preschool, Dhanori",
  "addressLocality": "Pune",
  "addressRegion": "Maharashtra",
  "postalCode": "411015",
  "addressCountry": "IN"
},
"openingHours": "Mo-Sa 10:00-20:00"
}
</script>
</head>

<body>

<header>
  <div id="nav-placeholder"></div>
</header>

<section class="registration-shell">
  <div class="container registration-shell__inner">
    <div class="registration-card">
      <div class="registration-card__header">
        <h1>Admission Form for Phonics Batches</h1>
      </div>

      <form id="admissionForm" class="registration-form" novalidate>
        <div class="registration-section">
          <h2>Parent Details</h2>
          <div class="form-grid form-grid--register">
            <div class="field">
              <label for="parentName">Parent Name *</label>
              <input id="parentName" name="parentName" type="text" required>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="mobile">Mobile *</label>
              <input id="mobile" name="mobile" type="tel" inputmode="numeric" required>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" required>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="city">City *</label>
              <input id="city" name="city" type="text" value="Pune" required>
              <p class="field-error"></p>
            </div>

            <div class="field field--full">
              <label for="address">Address</label>
              <input id="address" name="address" type="text">
              <p class="field-error"></p>
            </div>
          </div>
        </div>

        <div class="registration-section">
          <h2>Student Details</h2>
          <div class="form-grid form-grid--register">
            <div class="field">
              <label for="studentName">Student Name *</label>
              <input id="studentName" name="studentName" type="text" required>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" min="2" max="18">
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="school">School</label>
              <input id="school" name="school" type="text">
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="grade">Grade</label>
              <input id="grade" name="grade" type="text">
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="level">Level *</label>
              <select id="level" name="level" required>
                <option value="">Select</option>
                <option value="Basic" selected>Basic</option>
                <option value="Advanced">Advanced</option>
                <option value="Proficient">Proficient</option>
              </select>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="mode">Mode *</label>
              <select id="mode" name="mode" required>
                <option value="">Select</option>
                <option value="Online" selected>Online</option>
                <option value="Offline">Offline</option>
              </select>
              <p class="field-error"></p>
            </div>

            <div class="field">
              <label for="admissionSource">How Did You Hear About Us?</label>
              <select id="admissionSource" name="admissionSource">
                <option value="Website">Website</option>
                <option value="Google">Google</option>
                <option value="Friend Referral">Friend Referral</option>
                <option value="Social Media">Social Media</option>
                <option value="Poster/Hoarding">Poster/Hoarding</option>
                <option value="WhatsApp">WhatsApp</option>
              </select>
              <p class="field-error"></p>
            </div>

            <div class="field field--full">
              <label for="notes">Notes</label>
              <input id="notes" name="notes" type="text" placeholder="Preferred timing or learning concern">
              <p class="field-error"></p>
            </div>
          </div>
        </div>

        <div class="honeypot-field" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="registration-footer">
          <p class="registration-required">Fields marked * are required.</p>
          <div class="admission-actions">
            <button type="submit" class="btn admission-submit" id="admissionSubmit">Submit Admission</button>
          </div>
        </div>

        <div id="admissionMessage" class="admission-message" role="status" aria-live="polite"></div>
      </form>

      <div id="admissionSuccessPanel" class="admission-success-panel" hidden>
        <div class="admission-success-panel__inner">
          <div id="admissionSuccessMessage" class="admission-message is-success"></div>
          <div class="admission-success-actions">
            <a href="admissions.html" class="admission-success-link">Register another student</a>
            <a href="index.html" class="admission-success-link admission-success-link--secondary">Back to home</a>
          </div>
        </div>
      </div>

      <div id="admissionLoadingOverlay" class="admission-loading-overlay" hidden aria-hidden="true">
        <div class="admission-loading-card" role="status" aria-live="polite" aria-label="Processing registration">
          <span class="admission-loading-spinner"></span>
          <strong class="admission-loading-title">Processing your admission</strong>
          <p>Please wait. Do not close this page while we save your details.</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>

<script src="js/nav.js"></script>
<script src="js/admissions.js"></script>

<a href="https://wa.me/918793135679?text=Hello%20I%20want%20to%20enroll%20my%20child%20in%20phonics%20classes"
class="whatsapp-float"
target="_blank">
Chat On WhatsApp
</a>
</body>
</html>
