<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | ExcelKidsHub Phonics Academy</title>
<meta name="description" content="Reset your ExcelKidsHub account password.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css?v=20260706">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
.auth-container {
  max-width: 420px;
  margin: 60px auto;
  padding: 40px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}
.auth-container h1 {
  text-align: center;
  margin-bottom: 10px;
  color: #2b3a57;
  font-size: 26px;
}
.auth-container .subtitle {
  text-align: center;
  color: #666;
  font-size: 14px;
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 20px;
  position: relative;
}
.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #2b3a57;
  font-weight: 500;
  font-size: 14px;
}
.form-group input {
  width: 100%;
  padding: 12px 45px 12px 12px;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-size: 16px;
  box-sizing: border-box;
  transition: border-color 0.3s;
}
.form-group input:focus {
  outline: none;
  border-color: #facc15;
}
.form-group input.error { border-color: #dc3545; }
.form-group .error-text {
  color: #dc3545;
  font-size: 12px;
  margin-top: 5px;
  display: none;
}
.form-group .error-text.show { display: block; }
.password-toggle {
  position: absolute;
  right: 12px;
  top: 38px;
  cursor: pointer;
  color: #666;
  font-size: 14px;
  background: none;
  border: none;
  padding: 0;
}
.password-toggle:hover { color: #2b3a57; }
.btn-full {
  width: 100%;
  padding: 12px;
  background: #facc15;
  color: #2b3a57;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s;
  position: relative;
}
.btn-full:hover:not(:disabled) { background: #e5b800; }
.btn-full:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-full .spinner {
  display: none;
  width: 16px; height: 16px;
  border: 2px solid #2b3a57;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
}
.btn-full.loading .spinner { display: inline-block; }
.btn-full.loading .btn-text { visibility: hidden; }
@keyframes spin {
  0%   { transform: translate(-50%, -50%) rotate(0deg); }
  100% { transform: translate(-50%, -50%) rotate(360deg); }
}
.alert {
  padding: 12px 16px;
  border-radius: 5px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}
.alert-error   { background: #fee; color: #c33; border-left: 4px solid #dc3545; }
.alert-success { background: #efe; color: #276227; border-left: 4px solid #28a745; }
.auth-links {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}
.auth-links a { color: #2b3a57; text-decoration: none; font-weight: 500; }
.auth-links a:hover { text-decoration: underline; }
.invalid-token {
  text-align: center;
  padding: 20px 0;
  color: #555;
}
.invalid-token p { margin-bottom: 16px; }
</style>
</head>
<body>
<header><div id="nav-placeholder"></div></header>

<main>
<div class="auth-container">
  <h1>Reset Your Password</h1>
  <p class="subtitle">Enter your new password below.</p>

  <div id="alert-error"   class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <!-- Form shown when token is valid -->
  <form id="reset-form" novalidate>
    <div class="form-group">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
      <button type="button" class="password-toggle" id="toggle-password">Show</button>
      <div class="error-text" id="password-error">Password must be at least 8 characters</div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
      <button type="button" class="password-toggle" id="toggle-confirm">Show</button>
      <div class="error-text" id="confirm-error">Passwords do not match</div>
    </div>

    <button type="submit" class="btn-full" id="submit-btn">
      <span class="btn-text">Reset Password</span>
      <span class="spinner"></span>
    </button>
  </form>

  <!-- Shown when no token in URL -->
  <div id="invalid-token" class="invalid-token" style="display:none;">
    <p>This password reset link is invalid or has expired.</p>
    <a href="login.html" class="btn-full" style="display:inline-block; text-decoration:none; text-align:center; padding:12px;">Back to Login</a>
  </div>

  <div class="auth-links">
    <p><a href="login.html">Back to Login</a></p>
  </div>
</div>
</main>

<div id="footer-placeholder"></div>

<script type="module">
  import { api } from './js/api.js';

  const params    = new URLSearchParams(window.location.search);
  const token     = params.get('token');

  const resetForm     = document.getElementById('reset-form');
  const invalidDiv    = document.getElementById('invalid-token');
  const alertError    = document.getElementById('alert-error');
  const alertSuccess  = document.getElementById('alert-success');
  const submitBtn     = document.getElementById('submit-btn');
  const passwordInput = document.getElementById('password');
  const confirmInput  = document.getElementById('confirmPassword');

  // No token in URL — show error state
  if (!token) {
    resetForm.style.display = 'none';
    invalidDiv.style.display = 'block';
  }

  // ── Toggle password visibility ──────────────────────────────────────────────
  document.getElementById('toggle-password').addEventListener('click', () => {
    const t = passwordInput.type === 'password' ? 'text' : 'password';
    passwordInput.type = t;
    document.getElementById('toggle-password').textContent = t === 'password' ? 'Show' : 'Hide';
  });
  document.getElementById('toggle-confirm').addEventListener('click', () => {
    const t = confirmInput.type === 'password' ? 'text' : 'password';
    confirmInput.type = t;
    document.getElementById('toggle-confirm').textContent = t === 'password' ? 'Show' : 'Hide';
  });

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setError(input, errEl, msg) {
    input.classList.add('error');
    errEl.textContent = msg;
    errEl.classList.add('show');
  }
  function clearError(input, errEl) {
    input.classList.remove('error');
    errEl.classList.remove('show');
  }
  function showAlert(type, msg) {
    alertError.style.display   = 'none';
    alertSuccess.style.display = 'none';
    if (type === 'error') {
      alertError.textContent   = msg;
      alertError.style.display = 'block';
    } else {
      alertSuccess.textContent   = msg;
      alertSuccess.style.display = 'block';
    }
  }

  // Clear errors on input
  passwordInput.addEventListener('input', () => clearError(passwordInput, document.getElementById('password-error')));
  confirmInput.addEventListener('input',  () => clearError(confirmInput,  document.getElementById('confirm-error')));

  // ── Submit ───────────────────────────────────────────────────────────────────
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = passwordInput.value;
    const confirm  = confirmInput.value;
    let valid = true;

    if (!password || password.length < 8) {
      setError(passwordInput, document.getElementById('password-error'), 'Password must be at least 8 characters');
      valid = false;
    }
    if (!confirm) {
      setError(confirmInput, document.getElementById('confirm-error'), 'Please confirm your password');
      valid = false;
    } else if (password !== confirm) {
      setError(confirmInput, document.getElementById('confirm-error'), 'Passwords do not match');
      valid = false;
    }
    if (!valid) return;

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    try {
      await api.post('/auth/reset-password', { token, newPassword: password });
      showAlert('success', 'Password reset successful! Redirecting to login...');
      resetForm.style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } catch (err) {
      showAlert('error', err.message || 'This link has expired. Please request a new password reset.');
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });
</script>

<script src="js/nav.js?v=20260706"></script>
<script src="js/script.js?v=20260706"></script>
</body>
</html>
