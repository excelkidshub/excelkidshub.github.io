<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Courses | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="page-header">
    <h1>Courses</h1>
    <p>Create and manage reading studio courses. Slug maps to the reading studio URL path.</p>
  </div>

  <div id="alert-error"   class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <div class="toolbar">
    <button class="btn btn-primary" id="new-course-btn">+ New Course</button>
    <span id="result-count" style="color:#888;font-size:12px;margin-left:4px;"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Level</th>
          <th>Slug</th>
          <th>Age Group</th>
          <th>Lessons</th>
          <th>Free</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="courses-body">
        <tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Course Modal -->
<div class="modal-backdrop" id="course-modal" style="display:none;">
  <div class="modal">
    <h2 id="modal-title">New Course</h2>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="course-title" placeholder="e.g. Phonics Level 1">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label>Level Name</label>
        <input type="text" id="course-level" placeholder="e.g. Level 1">
      </div>
      <div class="form-group">
        <label>Age Group</label>
        <input type="text" id="course-age" placeholder="e.g. 4-7 years">
      </div>
    </div>

    <div class="form-group">
      <label>Slug <span style="font-weight:400;text-transform:none;font-size:11px;color:#888;">(URL path in reading studio, e.g. phonics/level-1)</span></label>
      <input type="text" id="course-slug" placeholder="phonics/level-1">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="course-description" rows="2" placeholder="Short description…"></textarea>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label>Thumbnail URL</label>
        <input type="text" id="course-thumbnail" placeholder="https://…">
      </div>
      <div class="form-group">
        <label>Total Lessons / Pages</label>
        <input type="number" id="course-lessons" min="0" placeholder="70">
      </div>
    </div>

    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;">
        <input type="checkbox" id="course-free" style="width:auto;">
        Free course (accessible to all authenticated users without a subscription)
      </label>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save Course</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetCourses, adminCreateCourse, adminUpdateCourse, adminSetCourseStatus } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const alertSuccess = document.getElementById('alert-success');
  const tbody        = document.getElementById('courses-body');
  const countEl      = document.getElementById('result-count');
  const modal        = document.getElementById('course-modal');
  let editingId = null;

  function showAlert(type, msg) {
    alertError.style.display = alertSuccess.style.display = 'none';
    if (type === 'error') {
      alertError.textContent   = msg;
      alertError.style.display = 'block';
    } else {
      alertSuccess.textContent   = msg;
      alertSuccess.style.display = 'block';
    }
    setTimeout(() => { alertError.style.display = alertSuccess.style.display = 'none'; }, 4000);
  }

  async function load() {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      const res   = await adminGetCourses();
      const data  = res.data || res;
      const rows  = data.content || data.courses || data || [];
      const total = data.totalElements || rows.length;

      countEl.textContent = `${total} course${total !== 1 ? 's' : ''}`;

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">No courses found.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(c => `
        <tr>
          <td>${c.id}</td>
          <td><strong>${c.title || '—'}</strong></td>
          <td>${c.levelName || '—'}</td>
          <td><code style="font-size:11px;background:#f3f4f6;padding:2px 6px;border-radius:3px;">${c.slug || '—'}</code></td>
          <td>${c.ageGroup || '—'}</td>
          <td>${c.totalLessons != null ? c.totalLessons : '—'}</td>
          <td>${c.isFree
            ? '<span class="badge badge-green">Free</span>'
            : '<span class="badge badge-gray">Paid</span>'}</td>
          <td>${c.active !== false
            ? '<span class="badge badge-green">Active</span>'
            : '<span class="badge badge-red">Inactive</span>'}</td>
          <td style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm btn-ghost"
              onclick='openEdit(${JSON.stringify(c).replace(/"/g, "&quot;")})'>Edit</button>
            ${c.active !== false
              ? `<button class="btn btn-sm btn-danger" onclick="toggleStatus(${c.id}, false)">Deactivate</button>`
              : `<button class="btn btn-sm btn-success" onclick="toggleStatus(${c.id}, true)">Activate</button>`}
          </td>
        </tr>`).join('');

    } catch (err) {
      showAlert('error', err.message);
    }
  }

  function openModal(course) {
    editingId = course ? course.id : null;
    document.getElementById('modal-title').textContent        = course ? 'Edit Course' : 'New Course';
    document.getElementById('course-title').value             = course?.title         || '';
    document.getElementById('course-level').value             = course?.levelName     || '';
    document.getElementById('course-age').value               = course?.ageGroup      || '';
    document.getElementById('course-slug').value              = course?.slug          || '';
    document.getElementById('course-description').value       = course?.description   || '';
    document.getElementById('course-thumbnail').value         = course?.thumbnailUrl  || '';
    document.getElementById('course-lessons').value           = course?.totalLessons  ?? '';
    document.getElementById('course-free').checked            = course?.isFree        || false;
    modal.style.display = 'flex';
  }

  // Exposed to inline onclick handlers
  window.openEdit      = (c)        => openModal(c);
  window.toggleStatus  = async (id, active) => {
    if (!confirm(`${active ? 'Activate' : 'Deactivate'} this course?`)) return;
    try {
      await adminSetCourseStatus(id, active);
      showAlert('success', `Course ${active ? 'activated' : 'deactivated'}.`);
      load();
    } catch (err) { showAlert('error', err.message); }
  };

  document.getElementById('new-course-btn').addEventListener('click', () => openModal(null));
  document.getElementById('modal-cancel').addEventListener('click',   () => { modal.style.display = 'none'; });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const dto = {
      title:        document.getElementById('course-title').value.trim(),
      levelName:    document.getElementById('course-level').value.trim(),
      ageGroup:     document.getElementById('course-age').value.trim(),
      slug:         document.getElementById('course-slug').value.trim(),
      description:  document.getElementById('course-description').value.trim(),
      thumbnailUrl: document.getElementById('course-thumbnail').value.trim() || null,
      totalLessons: parseInt(document.getElementById('course-lessons').value, 10) || null,
      isFree:       document.getElementById('course-free').checked,
    };

    if (!dto.title) {
      showAlert('error', 'Course title is required.');
      return;
    }
    if (!dto.slug) {
      showAlert('error', 'Slug is required (e.g. phonics/level-1).');
      return;
    }

    try {
      if (editingId) {
        await adminUpdateCourse(editingId, dto);
        showAlert('success', 'Course updated.');
      } else {
        await adminCreateCourse(dto);
        showAlert('success', 'Course created.');
      }
      modal.style.display = 'none';
      load();
    } catch (err) {
      showAlert('error', err.message);
    }
  });

  load();
</script>
</body>
</html>
