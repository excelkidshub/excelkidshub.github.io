<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Refunds | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="page-header">
    <h1>Refund Requests</h1>
    <p>Manage customer refund requests and process approvals.</p>
  </div>

  <div id="alert-error" class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <div class="toolbar">
    <select id="status-filter">
      <option value="">All Statuses</option>
      <option value="REQUESTED">Requested</option>
      <option value="APPROVED">Approved</option>
      <option value="REJECTED">Rejected</option>
      <option value="REFUNDED">Refunded</option>
    </select>
    <button class="btn btn-primary" id="filter-btn">Filter</button>
    <button class="btn btn-secondary" id="pending-btn">Show Pending Only</button>
    <span id="result-count" style="color:#888;font-size:12px;margin-left:4px;"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Customer</th>
          <th>Plan</th>
          <th>Amount</th>
          <th>Purchase Date</th>
          <th>Requested</th>
          <th>Status</th>
          <th>Reason</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="refunds-body">
        <tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Refund Details Modal -->
<div id="refund-modal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:600px;">
    <div class="modal-header">
      <h2>Refund Request Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      Loading…
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetRefunds, adminGetPendingRefunds, adminGetRefundById, adminProcessRefundAction } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const alertSuccess = document.getElementById('alert-success');
  const tbody        = document.getElementById('refunds-body');
  const countEl      = document.getElementById('result-count');
  const modal        = document.getElementById('refund-modal');
  const modalBody    = document.getElementById('modal-body');

  let currentStatus = '';
  let showPendingOnly = false;

  function statusBadge(s) {
    const map = { 
      REQUESTED:'badge-yellow', 
      APPROVED:'badge-blue', 
      REJECTED:'badge-red', 
      REFUNDED:'badge-green' 
    };
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function fmtAmount(a) {
    return a != null ? `₹${Number(a).toLocaleString('en-IN')}` : '—';
  }

  function hideAlerts() {
    alertError.style.display = 'none';
    alertSuccess.style.display = 'none';
  }

  async function load() {
    hideAlerts();
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      let data;
      if (showPendingOnly) {
        data = await adminGetPendingRefunds();
      } else {
        data = await adminGetRefunds(currentStatus);
      }
      const refunds = data.data || data;

      countEl.textContent = `${refunds.length} refund${refunds.length!==1?'s':''}`;

      if (!refunds.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">No refund requests found.</td></tr>';
        return;
      }

      tbody.innerHTML = refunds.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>
            <div style="font-weight:600;">${r.userName||'—'}</div>
            <small style="color:#888;">${r.userEmail||'—'}</small>
          </td>
          <td>${r.planName||'—'}</td>
          <td style="font-weight:600;">${fmtAmount(r.amount)}</td>
          <td>${formatDate(r.purchaseDate)}</td>
          <td>${formatDate(r.requestedAt)}</td>
          <td>${statusBadge(r.status)}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.requestReason||''}">${r.requestReason||'—'}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="viewRefund(${r.id})">View</button>
          </td>
        </tr>`).join('');
    } catch (err) {
      alertError.textContent = err.message;
      alertError.style.display = 'block';
    }
  }

  window.viewRefund = async function(id) {
    hideAlerts();
    modalBody.innerHTML = '<p style="text-align:center;padding:32px;color:#888;">Loading…</p>';
    modal.style.display = 'block';

    try {
      const data = await adminGetRefundById(id);
      const r = data.data || data;

      let actionButtons = '';
      if (r.status === 'REQUESTED') {
        actionButtons = `
          <div style="margin-top:24px;padding-top:24px;border-top:1px solid #e2e8f0;">
            <h3 style="font-size:16px;margin-bottom:12px;">Admin Actions</h3>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="processAction(${id}, 'APPROVE')">Approve</button>
              <button class="btn btn-danger" onclick="processAction(${id}, 'REJECT')">Reject</button>
            </div>
            <div style="margin-top:12px;">
              <textarea id="admin-note" placeholder="Admin note (optional)" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit;" rows="2"></textarea>
            </div>
          </div>
        `;
      } else if (r.status === 'APPROVED') {
        actionButtons = `
          <div style="margin-top:24px;padding-top:24px;border-top:1px solid #e2e8f0;">
            <h3 style="font-size:16px;margin-bottom:12px;">Complete Refund</h3>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
              <button class="btn btn-success" onclick="showAutoRefund()">Process Refund (Automatic)</button>
              <button class="btn btn-primary" onclick="showManualRefund()">Manual Entry</button>
            </div>
            <div id="manual-refund-section" style="display:none;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;">
              <p style="font-size:13px;color:#667085;margin-bottom:12px;">
                If you've already processed the refund manually in Razorpay, enter the Razorpay Refund ID here.
              </p>
              <div style="margin-bottom:12px;">
                <label style="display:block;font-size:13px;margin-bottom:4px;">Razorpay Refund ID *</label>
                <input type="text" id="razorpay-refund-id" placeholder="e.g. rfnd_..." style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;">
              </div>
              <div style="margin-bottom:12px;">
                <textarea id="admin-note-manual" placeholder="Admin note (optional)" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit;" rows="2"></textarea>
              </div>
              <button class="btn btn-success" onclick="processAction(${id}, 'MARK_REFUNDED', 'manual')">Mark as Refunded</button>
            </div>
            <div id="auto-refund-section" style="display:none;padding:16px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;margin-bottom:12px;">
              <p style="font-size:13px;color:#166534;margin-bottom:12px;">
                ✓ This will process the refund automatically via Razorpay API. The refund will be sent to the customer's original payment method.
              </p>
              <div style="margin-bottom:12px;">
                <textarea id="admin-note-auto" placeholder="Admin note (optional)" style="width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:4px;font-family:inherit;" rows="2"></textarea>
              </div>
              <button class="btn btn-success" onclick="processAction(${id}, 'MARK_REFUNDED', 'auto')">Process Refund Now</button>
            </div>
          </div>
        `;
      }

      modalBody.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <h3 style="font-size:14px;color:#667085;margin-bottom:8px;">Customer</h3>
            <p style="margin:0 0 16px 0;"><strong>${r.userName||'—'}</strong></p>
            <p style="margin:0 0 16px 0;color:#666;">${r.userEmail||'—'}</p>
          </div>
          <div>
            <h3 style="font-size:14px;color:#667085;margin-bottom:8px;">Purchase</h3>
            <p style="margin:0 0 8px 0;"><strong>Plan:</strong> ${r.planName||'—'}</p>
            <p style="margin:0 0 8px 0;"><strong>Amount:</strong> ${fmtAmount(r.amount)}</p>
            <p style="margin:0 0 8px 0;"><strong>Date:</strong> ${formatDate(r.purchaseDate)}</p>
            <p style="margin:0 0 16px 0;"><strong>Payment ID:</strong> ${r.paymentId||'—'}</p>
          </div>
        </div>
        
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;">
          <h3 style="font-size:14px;color:#667085;margin-bottom:8px;">Refund Request</h3>
          <p style="margin:0 0 8px 0;"><strong>Requested:</strong> ${formatDate(r.requestedAt)}</p>
          <p style="margin:0 0 8px 0;"><strong>Reason:</strong> ${r.requestReason||'Not provided'}</p>
          <p style="margin:0 0 16px 0;"><strong>Status:</strong> ${statusBadge(r.status)}</p>
        </div>

        ${r.reviewedAt ? `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;">
          <h3 style="font-size:14px;color:#667085;margin-bottom:8px;">Review</h3>
          <p style="margin:0 0 8px 0;"><strong>Reviewed:</strong> ${formatDate(r.reviewedAt)}</p>
          <p style="margin:0 0 8px 0;"><strong>Reviewed By:</strong> ${r.reviewedBy||'—'}</p>
          <p style="margin:0 0 16px 0;"><strong>Admin Note:</strong> ${r.adminNote||'—'}</p>
        </div>
        ` : ''}

        ${r.processedAt ? `
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;">
          <h3 style="font-size:14px;color:#667085;margin-bottom:8px;">Refund Processed</h3>
          <p style="margin:0 0 8px 0;"><strong>Processed:</strong> ${formatDate(r.processedAt)}</p>
          <p style="margin:0 0 8px 0;"><strong>Processed By:</strong> ${r.processedBy||'—'}</p>
          <p style="margin:0 0 8px 0;"><strong>Razorpay Refund ID:</strong> <code>${r.razorpayRefundId||'—'}</code></p>
          <p style="margin:0 0 16px 0;"><strong>Refund Amount:</strong> ${fmtAmount(r.refundAmount)}</p>
        </div>
        ` : ''}

        ${actionButtons}
      `;
    } catch (err) {
      modalBody.innerHTML = `<p style="color:#dc2626;">Error: ${err.message}</p>`;
    }
  };

  window.closeModal = function() {
    modal.style.display = 'none';
  };

  window.showManualRefund = function() {
    document.getElementById('manual-refund-section').style.display = 'block';
    document.getElementById('auto-refund-section').style.display = 'none';
  };

  window.showAutoRefund = function() {
    document.getElementById('auto-refund-section').style.display = 'block';
    document.getElementById('manual-refund-section').style.display = 'none';
  };

  window.processAction = async function(id, action, mode) {
    hideAlerts();
    let adminNote = '';
    const razorpayRefundId = document.getElementById('razorpay-refund-id')?.value || '';

    if (action === 'MARK_REFUNDED') {
      if (mode === 'manual') {
        adminNote = document.getElementById('admin-note-manual')?.value || '';
        if (!razorpayRefundId.trim()) {
          alertError.textContent = 'Razorpay Refund ID is required for manual entry.';
          alertError.style.display = 'block';
          return;
        }
      } else if (mode === 'auto') {
        adminNote = document.getElementById('admin-note-auto')?.value || '';
      } else {
        // For APPROVE/REJECT actions
        adminNote = document.getElementById('admin-note')?.value || '';
      }
    } else {
      // For APPROVE/REJECT actions
      adminNote = document.getElementById('admin-note')?.value || '';
    }

    const confirmMessage = mode === 'auto' 
      ? 'This will process the refund automatically via Razorpay. Are you sure?'
      : `Are you sure you want to ${action.toLowerCase()} this refund request?`;

    if (!confirm(confirmMessage)) {
      return;
    }

    try {
      const payload = { action, adminNote };
      if (razorpayRefundId) {
        payload.razorpayRefundId = razorpayRefundId;
      }
      
      await adminProcessRefundAction(id, payload);
      alertSuccess.textContent = `Refund ${action.toLowerCase()} successfully.`;
      alertSuccess.style.display = 'block';
      closeModal();
      load();
    } catch (err) {
      alertError.textContent = err.message;
      alertError.style.display = 'block';
    }
  };

  document.getElementById('filter-btn').addEventListener('click', () => {
    currentStatus = document.getElementById('status-filter').value;
    showPendingOnly = false;
    load();
  });

  document.getElementById('pending-btn').addEventListener('click', () => {
    showPendingOnly = true;
    currentStatus = '';
    document.getElementById('status-filter').value = '';
    load();
  });

  // Close modal on outside click
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  load();
</script>
</body>
</html>
