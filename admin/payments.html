<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Payments | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="page-header">
    <h1>Payments</h1>
    <p>View all Razorpay payment transactions.</p>
  </div>

  <div id="alert-error" class="alert alert-error"></div>

  <div class="toolbar">
    <select id="status-filter">
      <option value="">All Statuses</option>
      <option value="SUCCESS">Success</option>
      <option value="PENDING">Pending</option>
      <option value="FAILED">Failed</option>
    </select>
    <button class="btn btn-primary" id="filter-btn">Filter</button>
    <span id="result-count" style="color:#888;font-size:12px;margin-left:4px;"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Razorpay Order ID</th>
          <th>Razorpay Payment ID</th>
          <th>Date</th>
          <th>Failure Reason</th>
        </tr>
      </thead>
      <tbody id="payments-body">
        <tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetPayments } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const tbody        = document.getElementById('payments-body');
  const countEl      = document.getElementById('result-count');
  const paginationEl = document.getElementById('pagination');

  let currentPage = 0, currentStatus = '';

  function statusBadge(s) {
    const map = { SUCCESS:'badge-green', PENDING:'badge-yellow', FAILED:'badge-red' };
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function fmtAmount(a, c) {
    return a != null ? `₹${Number(a).toLocaleString('en-IN')} ${c||'INR'}` : '—';
  }

  async function load() {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      const res  = await adminGetPayments(currentStatus, currentPage);
      const data = res.data || res;
      const rows = data.content || [];
      const total = data.totalElements || rows.length;

      countEl.textContent = `${total} payment${total!==1?'s':''}`;

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">No payments found.</td></tr>';
        paginationEl.innerHTML = '';
        return;
      }

      tbody.innerHTML = rows.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><small>${p.userEmail||'—'}</small></td>
          <td style="font-weight:600;">${fmtAmount(p.amount, p.currency)}</td>
          <td>${statusBadge(p.status)}</td>
          <td><small style="font-family:monospace;font-size:11px;">${p.razorpayOrderId||'—'}</small></td>
          <td><small style="font-family:monospace;font-size:11px;">${p.razorpayPaymentId||'—'}</small></td>
          <td>${formatDate(p.paymentDate)}</td>
          <td style="color:#dc2626;font-size:12px;">${p.failureReason||''}</td>
        </tr>`).join('');

      const totalPages = data.totalPages || 1;
      let pg = '';
      if (totalPages > 1) {
        pg += `<button ${currentPage===0?'disabled':''} onclick="goPage(${currentPage-1})">‹ Prev</button>`;
        for (let i = 0; i < Math.min(totalPages,7); i++) {
          pg += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
        }
        pg += `<button ${currentPage>=totalPages-1?'disabled':''} onclick="goPage(${currentPage+1})">Next ›</button>`;
        pg += `<span class="pagination-info">Page ${currentPage+1} of ${totalPages}</span>`;
      }
      paginationEl.innerHTML = pg;
    } catch (err) {
      alertError.textContent = err.message;
      alertError.style.display = 'block';
    }
  }

  window.goPage = function(p) { currentPage = p; load(); };

  document.getElementById('filter-btn').addEventListener('click', () => {
    currentStatus = document.getElementById('status-filter').value;
    currentPage = 0;
    load();
  });

  load();
</script>
</body>
</html>
