<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Plans | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="admin-topbar__title">Plans</div>
    <div class="admin-topbar__actions">
      <span style="color: #666; font-size: 13px;">Manage subscription plans.</span>
    </div>
  </div>
  <div class="page-header">
    <p>Changes take effect for new purchases immediately.</p>
  </div>

  <div id="alert-error"   class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <div class="toolbar">
    <button class="btn btn-primary" id="new-plan-btn">+ New Plan</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Duration</th>
          <th>Popular</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="plans-body">
        <tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Plan Modal -->
<div class="modal-backdrop" id="plan-modal" style="display:none;">
  <div class="modal">
    <h2 id="modal-title">New Plan</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="plan-name" placeholder="e.g. Digital Reading Level 1">
    </div>
    <div class="form-group">
      <label>Price (₹)</label>
      <input type="number" id="plan-price" min="0" step="1" placeholder="499">
    </div>
    <div class="form-group">
      <label>Duration (months, 0 = forever/free)</label>
      <input type="number" id="plan-duration" min="0" placeholder="1">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="plan-description" rows="2" placeholder="Short description…"></textarea>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;">
        <input type="checkbox" id="plan-popular" style="width:auto;">
        Mark as Most Popular
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save Plan</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetPlans, adminCreatePlan, adminUpdatePlan } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const alertSuccess = document.getElementById('alert-success');
  const tbody        = document.getElementById('plans-body');
  const modal        = document.getElementById('plan-modal');
  let editingId = null;

  function showAlert(type, msg) {
    alertError.style.display = alertSuccess.style.display = 'none';
    if (type === 'error') { alertError.textContent = msg; alertError.style.display = 'block'; }
    else { alertSuccess.textContent = msg; alertSuccess.style.display = 'block'; }
    setTimeout(() => { alertError.style.display = alertSuccess.style.display = 'none'; }, 4000);
  }

  function fmtPrice(p) {
    return p === 0 ? '<span class="badge badge-green">Free</span>'
      : `₹${Number(p).toLocaleString('en-IN')}`;
  }

  async function load() {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      const res  = await adminGetPlans();
      const data = res.data || res;
      const rows = (data.content || data.plans || data || []);

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:#888;">No plans found.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><strong>${p.name}</strong></td>
          <td>${fmtPrice(p.price)}</td>
          <td>${p.durationMonths === 0 ? 'Forever' : p.durationMonths + ' month(s)'}</td>
          <td>${p.isPopular ? '<span class="badge badge-blue">⭐ Yes</span>' : '—'}</td>
          <td style="max-width:220px;color:#666;">${p.description || '—'}</td>
          <td><button class="btn btn-sm btn-ghost" onclick="openEdit(${JSON.stringify(p).replace(/"/g,'&quot;')})">Edit</button></td>
        </tr>`).join('');
    } catch (err) {
      showAlert('error', err.message);
    }
  }

  function openModal(plan) {
    editingId = plan ? plan.id : null;
    document.getElementById('modal-title').textContent = plan ? 'Edit Plan' : 'New Plan';
    document.getElementById('plan-name').value        = plan?.name        || '';
    document.getElementById('plan-price').value       = plan?.price       ?? '';
    document.getElementById('plan-duration').value    = plan?.durationMonths ?? '';
    document.getElementById('plan-description').value = plan?.description  || '';
    document.getElementById('plan-popular').checked   = plan?.isPopular    || false;
    modal.style.display = 'flex';
  }

  window.openEdit = function(p) { openModal(p); };
  document.getElementById('new-plan-btn').addEventListener('click', () => openModal(null));
  document.getElementById('modal-cancel').addEventListener('click', () => { modal.style.display = 'none'; });

  document.getElementById('modal-save').addEventListener('click', async () => {
    const dto = {
      name:          document.getElementById('plan-name').value.trim(),
      price:         parseFloat(document.getElementById('plan-price').value),
      durationMonths:parseInt(document.getElementById('plan-duration').value, 10),
      description:   document.getElementById('plan-description').value.trim(),
      isPopular:     document.getElementById('plan-popular').checked,
    };

    if (!dto.name || isNaN(dto.price) || isNaN(dto.durationMonths)) {
      showAlert('error', 'Name, price, and duration are required.');
      return;
    }

    try {
      if (editingId) {
        await adminUpdatePlan(editingId, dto);
        showAlert('success', 'Plan updated.');
      } else {
        await adminCreatePlan(dto);
        showAlert('success', 'Plan created.');
      }
      modal.style.display = 'none';
      load();
    } catch (err) { showAlert('error', err.message); }
  });

  load();
</script>
</body>
</html>
