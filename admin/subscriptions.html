<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Subscriptions | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="admin-topbar__title">Subscriptions</div>
    <div class="admin-topbar__actions">
      <span style="color: #666; font-size: 13px;">View and manage user subscriptions.</span>
    </div>
  </div>
  <div class="page-header">
    <p>Manually activate or expire as needed.</p>
  </div>

  <div id="alert-error"   class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <div class="toolbar">
    <input type="search" id="search-input" placeholder="Search by email or name…" style="min-width:220px;">
    <select id="status-filter">
      <option value="">All Statuses</option>
      <option value="ACTIVE">Active</option>
      <option value="EXPIRED">Expired</option>
      <option value="PENDING">Pending</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
    <button class="btn btn-primary" id="filter-btn">Search / Filter</button>
    <span id="result-count" style="color:#888;font-size:12px;margin-left:4px;"></span>
    <button class="btn btn-success" id="grant-btn" style="margin-left:auto;">＋ Grant Subscription</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>User</th>
          <th>Plan</th>
          <th>Status</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="subs-body">
        <tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<!-- ── Grant Subscription Modal ─────────────────────────────────────── -->
<div id="grant-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:32px;width:100%;max-width:480px;margin:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <h3 style="margin:0 0 20px;font-size:18px;">Grant Subscription</h3>
    <div id="grant-error" class="alert alert-error" style="display:none;margin-bottom:16px;"></div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <label style="font-size:13px;font-weight:600;color:#444;">
        User ID <span style="color:#e74c3c;">*</span>
        <input id="grant-userId" type="number" min="1" placeholder="e.g. 42"
          style="margin-top:4px;width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
        <span style="font-size:11px;color:#888;margin-top:2px;display:block;">Find the User ID on the Users page.</span>
      </label>

      <label style="font-size:13px;font-weight:600;color:#444;">
        Plan <span style="color:#e74c3c;">*</span>
        <select id="grant-planId"
          style="margin-top:4px;width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
          <option value="">Loading plans…</option>
        </select>
      </label>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <label style="font-size:13px;font-weight:600;color:#444;">
          Start Date <span style="color:#e74c3c;">*</span>
          <input id="grant-startDate" type="date"
            style="margin-top:4px;width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
        </label>
        <label style="font-size:13px;font-weight:600;color:#444;">
          End Date <span style="color:#e74c3c;">*</span>
          <input id="grant-endDate" type="date"
            style="margin-top:4px;width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
        </label>
      </div>

      <label style="font-size:13px;font-weight:600;color:#444;">
        Note (optional)
        <input id="grant-note" type="text" placeholder="e.g. Compensation for downtime"
          style="margin-top:4px;width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
      </label>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px;">
      <button class="btn btn-ghost" id="grant-cancel">Cancel</button>
      <button class="btn btn-success" id="grant-submit">Grant Subscription</button>
    </div>
  </div>
</div>

<!-- ── Extend Subscription Modal ─────────────────────────────────────── -->
<div id="extend-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:32px;width:100%;max-width:400px;margin:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <h3 style="margin:0 0 8px;font-size:18px;">Extend Subscription</h3>
    <p id="extend-info" style="margin:0 0 20px;font-size:13px;color:#666;"></p>
    <div id="extend-error" class="alert alert-error" style="display:none;margin-bottom:16px;"></div>

    <label style="font-size:13px;font-weight:600;color:#444;display:block;">
      New End Date <span style="color:#e74c3c;">*</span>
      <input id="extend-endDate" type="date"
        style="margin-top:4px;width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box;">
    </label>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:24px;">
      <button class="btn btn-ghost" id="extend-cancel">Cancel</button>
      <button class="btn btn-primary" id="extend-submit">Extend</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetSubs, adminSetSubStatus, adminGrantSubscription, adminExtendSubscription, adminGetPlans } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const alertSuccess = document.getElementById('alert-success');
  const tbody        = document.getElementById('subs-body');
  const countEl      = document.getElementById('result-count');
  const paginationEl = document.getElementById('pagination');

  let currentPage = 0;
  let currentStatus = '';
  let currentSearch = '';

  // ── Auto-populate search from URL param (e.g. ?search=user@email.com) ────
  const _urlSearch = new URLSearchParams(window.location.search).get('search');
  if (_urlSearch) {
    currentSearch = _urlSearch;
    document.getElementById('search-input').value = _urlSearch;
  }

  function showAlert(type, msg) {
    alertError.style.display = alertSuccess.style.display = 'none';
    if (type === 'error') { alertError.textContent = msg; alertError.style.display = 'block'; }
    else { alertSuccess.textContent = msg; alertSuccess.style.display = 'block'; }
    setTimeout(() => { alertError.style.display = alertSuccess.style.display = 'none'; }, 4000);
  }

  function statusBadge(s) {
    const map = { ACTIVE: 'badge-green', EXPIRED: 'badge-red', PENDING: 'badge-yellow', CANCELLED: 'badge-gray' };
    return `<span class="badge ${map[s] || 'badge-gray'}">${s}</span>`;
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function load() {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      const res  = await adminGetSubs(currentStatus, currentPage, currentSearch);
      const data = res.data || res;
      const rows = data.content || [];
      const total = data.totalElements || rows.length;

      countEl.textContent = `${total} subscription${total !== 1 ? 's' : ''}`;

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:#888;">No subscriptions found.</td></tr>';
        paginationEl.innerHTML = '';
        return;
      }

      tbody.innerHTML = rows.map(s => `
        <tr>
          <td>${s.id}</td>
          <td><small>${s.userEmail || '—'}</small><br><span style="color:#888;font-size:11px;">${s.userName || ''}</span></td>
          <td>${s.planName || '—'}</td>
          <td>${statusBadge(s.status)}</td>
          <td>${formatDate(s.startDate)}</td>
          <td>${formatDate(s.endDate)}</td>
          <td>${formatDate(s.createdAt)}</td>
          <td style="display:flex;gap:6px;flex-wrap:wrap;">
            ${s.status !== 'ACTIVE'
              ? `<button class="btn btn-sm btn-success" onclick="setStatus(${s.id},'ACTIVE')">Activate</button>`
              : ''}
            ${s.status !== 'EXPIRED'
              ? `<button class="btn btn-sm btn-danger" onclick="setStatus(${s.id},'EXPIRED')">Expire</button>`
              : ''}
            <button class="btn btn-sm btn-primary" onclick="openExtend(${s.id},'${s.userEmail}','${s.endDate}')">Extend</button>
          </td>
        </tr>`).join('');

      const totalPages = data.totalPages || 1;
      let pg = '';
      if (totalPages > 1) {
        pg += `<button ${currentPage===0?'disabled':''} onclick="goPage(${currentPage-1})">‹ Prev</button>`;
        for (let i = 0; i < Math.min(totalPages,7); i++) {
          pg += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i+1}</button>`;
        }
        pg += `<button ${currentPage>=totalPages-1?'disabled':''} onclick="goPage(${currentPage+1})">Next ›</button>`;
        pg += `<span class="pagination-info">Page ${currentPage+1} of ${totalPages}</span>`;
      }
      paginationEl.innerHTML = pg;

    } catch (err) {
      showAlert('error', err.message);
    }
  }

  window.setStatus = async function(id, status) {
    if (!confirm(`Set subscription ${id} to ${status}?`)) return;
    try {
      await adminSetSubStatus(id, status);
      showAlert('success', `Subscription status updated to ${status}.`);
      load();
    } catch (err) { showAlert('error', err.message); }
  };

  window.goPage = function(p) { currentPage = p; load(); };

  document.getElementById('filter-btn').addEventListener('click', () => {
    currentStatus = document.getElementById('status-filter').value;
    currentSearch = document.getElementById('search-input').value.trim();
    currentPage = 0;
    load();
  });
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('filter-btn').click();
  });

  // ── Grant Modal ───────────────────────────────────────────────────────────
  const grantModal   = document.getElementById('grant-modal');
  const grantError   = document.getElementById('grant-error');
  const grantPlanSel = document.getElementById('grant-planId');

  // Pre-fill today as default start date
  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  async function openGrantModal() {
    grantError.style.display = 'none';
    document.getElementById('grant-userId').value    = '';
    document.getElementById('grant-startDate').value = todayStr();
    document.getElementById('grant-endDate').value   = '';
    document.getElementById('grant-note').value      = '';

    // Load plans into select if not already loaded
    if (grantPlanSel.options.length <= 1) {
      grantPlanSel.innerHTML = '<option value="">Loading…</option>';
      try {
        const res   = await adminGetPlans();
        const plans = (res.data || res).content || res.data || [];
        grantPlanSel.innerHTML = '<option value="">— Select plan —</option>'
          + plans.map(p => `<option value="${p.id}">${p.name} (${p.durationMonths}mo)</option>`).join('');
      } catch {
        grantPlanSel.innerHTML = '<option value="">Failed to load plans</option>';
      }
    }

    grantModal.style.display = 'flex';
  }

  document.getElementById('grant-btn').addEventListener('click', openGrantModal);
  document.getElementById('grant-cancel').addEventListener('click', () => { grantModal.style.display = 'none'; });
  grantModal.addEventListener('click', e => { if (e.target === grantModal) grantModal.style.display = 'none'; });

  document.getElementById('grant-submit').addEventListener('click', async () => {
    grantError.style.display = 'none';
    const userId    = parseInt(document.getElementById('grant-userId').value, 10);
    const planId    = parseInt(document.getElementById('grant-planId').value, 10);
    const startDate = document.getElementById('grant-startDate').value;
    const endDate   = document.getElementById('grant-endDate').value;
    const note      = document.getElementById('grant-note').value.trim();

    if (!userId || !planId || !startDate || !endDate) {
      grantError.textContent = 'Please fill in all required fields.';
      grantError.style.display = 'block';
      return;
    }
    if (endDate <= startDate) {
      grantError.textContent = 'End date must be after start date.';
      grantError.style.display = 'block';
      return;
    }

    const btn = document.getElementById('grant-submit');
    btn.disabled = true;
    btn.textContent = 'Granting…';
    try {
      await adminGrantSubscription({ userId, planId, startDate, endDate, note: note || null });
      grantModal.style.display = 'none';
      showAlert('success', `Subscription granted to user ${userId} until ${endDate}.`);
      load();
    } catch (err) {
      grantError.textContent = err.message;
      grantError.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Grant Subscription';
    }
  });

  // ── Extend Modal ──────────────────────────────────────────────────────────
  const extendModal = document.getElementById('extend-modal');
  const extendError = document.getElementById('extend-error');
  let extendTargetId = null;

  window.openExtend = function(id, email, currentEndDate) {
    extendTargetId = id;
    extendError.style.display = 'none';
    document.getElementById('extend-info').textContent =
      `Subscription #${id} · ${email} · current end: ${formatDate(currentEndDate)}`;
    // Default to current end date + 30 days
    const suggested = currentEndDate
      ? new Date(new Date(currentEndDate).getTime() + 30 * 86400000).toISOString().split('T')[0]
      : todayStr();
    document.getElementById('extend-endDate').value = suggested;
    extendModal.style.display = 'flex';
  };

  document.getElementById('extend-cancel').addEventListener('click', () => { extendModal.style.display = 'none'; });
  extendModal.addEventListener('click', e => { if (e.target === extendModal) extendModal.style.display = 'none'; });

  document.getElementById('extend-submit').addEventListener('click', async () => {
    extendError.style.display = 'none';
    const newEndDate = document.getElementById('extend-endDate').value;
    if (!newEndDate) {
      extendError.textContent = 'Please select a new end date.';
      extendError.style.display = 'block';
      return;
    }

    const btn = document.getElementById('extend-submit');
    btn.disabled = true;
    btn.textContent = 'Extending…';
    try {
      await adminExtendSubscription(extendTargetId, newEndDate);
      extendModal.style.display = 'none';
      showAlert('success', `Subscription #${extendTargetId} extended to ${newEndDate}.`);
      load();
    } catch (err) {
      extendError.textContent = err.message;
      extendError.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Extend';
    }
  });

  load();
</script>
</body>
</html>
