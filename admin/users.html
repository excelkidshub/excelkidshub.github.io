<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Users | ExcelKidsHub Admin</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>

<div id="admin-nav-placeholder"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div class="admin-topbar__title">Users</div>
    <div class="admin-topbar__actions">
      <span style="color: #666; font-size: 13px;">Search, view and manage registered users.</span>
    </div>
  </div>

  <div id="alert-error"   class="alert alert-error"></div>
  <div id="alert-success" class="alert alert-success"></div>

  <div class="toolbar">
    <input type="search" id="search-input" placeholder="Search by email or name…">
    <button class="btn btn-primary" id="search-btn">Search</button>
    <span id="result-count" style="color:#888;font-size:12px;margin-left:4px;"></span>
  </div>

  <div class="table-wrap">
    <table id="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Name</th>
          <th>Role</th>
          <th>Verified</th>
          <th>Subscription</th>
          <th>Status</th>
          <th>Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-body">
        <tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<script type="module">
  import { requireAdmin } from './js/admin-guard.js';
  import { renderAdminNav } from './js/admin-nav.js';
  import { adminGetUsers, adminSetUserStatus } from './js/admin-api.js';

  requireAdmin();
  renderAdminNav();

  const alertError   = document.getElementById('alert-error');
  const alertSuccess = document.getElementById('alert-success');
  const tbody        = document.getElementById('users-body');
  const countEl      = document.getElementById('result-count');
  const paginationEl = document.getElementById('pagination');

  let currentPage = 0;
  let currentSearch = '';

  function showAlert(type, msg) {
    alertError.style.display = alertSuccess.style.display = 'none';
    if (type === 'error') { alertError.textContent = msg; alertError.style.display = 'block'; }
    else { alertSuccess.textContent = msg; alertSuccess.style.display = 'block'; }
    setTimeout(() => { alertError.style.display = alertSuccess.style.display = 'none'; }, 4000);
  }

  function badge(val, trueLabel, trueClass, falseLabel, falseClass) {
    return val
      ? `<span class="badge ${trueClass}">${trueLabel}</span>`
      : `<span class="badge ${falseClass}">${falseLabel}</span>`;
  }

  function formatDate(dt) {
    if (!dt) return '—';
    return new Date(dt).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  async function loadUsers() {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">Loading…</td></tr>';
    try {
      const res  = await adminGetUsers(currentSearch, currentPage);
      const data = res.data || res;
      const rows = data.content || [];
      const total = data.totalElements || rows.length;

      countEl.textContent = `${total} user${total !== 1 ? 's' : ''}`;

      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#888;">No users found.</td></tr>';
        paginationEl.innerHTML = '';
        return;
      }

      tbody.innerHTML = rows.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.email}</td>
          <td>${(u.firstName || '') + ' ' + (u.lastName || '')}</td>
          <td><span class="badge ${u.role === 'ADMIN' ? 'badge-blue' : 'badge-gray'}">${u.role || 'STUDENT'}</span></td>
          <td>${badge(u.emailVerified, '✓ Yes', 'badge-green', '✗ No', 'badge-red')}</td>
          <td>${u.subscriptionStatus
            ? `<span class="badge ${u.subscriptionStatus === 'ACTIVE' ? 'badge-green' : 'badge-yellow'}">${u.subscriptionStatus}</span> ${u.subscriptionPlan || ''}`
            : '<span class="badge badge-gray">None</span>'}</td>
          <td>${badge(u.active, 'Active', 'badge-green', 'Disabled', 'badge-red')}</td>
          <td>${formatDate(u.createdAt)}</td>
          <td>
            ${u.active
              ? `<button class="btn btn-sm btn-danger" onclick="setStatus(${u.id}, false)">Disable</button>`
              : `<button class="btn btn-sm btn-success" onclick="setStatus(${u.id}, true)">Enable</button>`}
          </td>
        </tr>`).join('');

      // Pagination
      const totalPages = data.totalPages || 1;
      let pg = '';
      if (totalPages > 1) {
        pg += `<button ${currentPage === 0 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹ Prev</button>`;
        for (let i = 0; i < Math.min(totalPages, 7); i++) {
          pg += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i + 1}</button>`;
        }
        pg += `<button ${currentPage >= totalPages - 1 ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">Next ›</button>`;
        pg += `<span class="pagination-info">Page ${currentPage + 1} of ${totalPages}</span>`;
      }
      paginationEl.innerHTML = pg;

    } catch (err) {
      showAlert('error', err.message);
    }
  }

  window.setStatus = async function(id, active) {
    if (!confirm(`${active ? 'Enable' : 'Disable'} this user?`)) return;
    try {
      await adminSetUserStatus(id, active);
      showAlert('success', `User ${active ? 'enabled' : 'disabled'} successfully.`);
      loadUsers();
    } catch (err) { showAlert('error', err.message); }
  };

  window.goPage = function(p) { currentPage = p; loadUsers(); };

  document.getElementById('search-btn').addEventListener('click', () => {
    currentSearch = document.getElementById('search-input').value.trim();
    currentPage = 0;
    loadUsers();
  });
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  });

  loadUsers();
</script>
</body>
</html>
